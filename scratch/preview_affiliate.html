<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Card Preview</title>
    <link rel="stylesheet" href="../assets/css/style_add.css">
    <style>
        body {
            background-color: #f5f7ff;
            padding: 40px 20px;
            font-family: "Verdana", "Hiragino Sans", "Meiryo", sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">PC / 通常表示プレビュー</div>
        <aside class="c-affiliate-card">
            <div class="c-affiliate-card__inner">
                <div class="c-affiliate-card__thumb-wrap">
                    <a href="https://www.amazon.co.jp/dp/483995555X" class="c-affiliate-card__thumb-link" target="_blank" rel="noopener noreferrer nofollow">
                        <img src="../assets/images/yuny_logo.png" alt="ノンデザイナーズ・デザインブック [第4版]" class="c-affiliate-card__thumb" loading="lazy">
                    </a>
                </div>
                <div class="c-affiliate-card__content">
                    <div class="c-affiliate-card__badge-row">
                        <span class="c-affiliate-card__badge">
                            <svg class="c-affiliate-card__badge-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
                            おすすめ書籍
                        </span>
                    </div>
                    <h4 class="c-affiliate-card__title">
                        <a href="https://www.amazon.co.jp/dp/483995555X" target="_blank" rel="noopener noreferrer nofollow">
                            ノンデザイナーズ・デザインブック [第4版]
                        </a>
                    </h4>
                    <div class="c-affiliate-card__comment">
                        <p class="c-affiliate-card__comment-text">デザインの4大原則（近接・整列・反復・コントラスト）が具体例とともに平易に解説された名著。非デザイナーやエンジニアがUI/Webデザインの基礎を身につけるための必読書です。</p>
                    </div>
                    <div class="c-affiliate-card__action">
                        <a href="https://www.amazon.co.jp/dp/483995555X" class="c-affiliate-card__btn c-affiliate-card__btn--amazon" target="_blank" rel="noopener noreferrer nofollow">
                            <svg class="c-affiliate-card__btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                            <span>Amazonで詳細を見る</span>
                            <svg class="c-affiliate-card__external-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                        </a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 画像なしバリアント -->
        <div class="label" style="margin-top: 40px;">画像なしバリアント</div>
        <aside class="c-affiliate-card c-affiliate-card--no-image">
            <div class="c-affiliate-card__inner">
                <div class="c-affiliate-card__content">
                    <div class="c-affiliate-card__badge-row">
                        <span class="c-affiliate-card__badge">
                            <svg class="c-affiliate-card__badge-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            おすすめツール
                        </span>
                    </div>
                    <h4 class="c-affiliate-card__title">
                        <a href="https://example.com" target="_blank" rel="noopener noreferrer nofollow">
                            Figma Professional プラン
                        </a>
                    </h4>
                    <div class="c-affiliate-card__comment">
                        <p class="c-affiliate-card__comment-text">チーム開発やデザインシステムの構築に最適な業界標準プロトタイピングツール。</p>
                    </div>
                    <div class="c-affiliate-card__action">
                        <a href="https://example.com" class="c-affiliate-card__btn c-affiliate-card__btn--amazon" target="_blank" rel="noopener noreferrer nofollow">
                            <span>詳細を見る</span>
                            <svg class="c-affiliate-card__external-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                        </a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 記事下広告（ad-widget） -->
        <div class="label" style="margin-top: 40px;">記事下広告（.ad-widget）表示</div>
        <div class="ad-widget ad-widget--bottom">
            <span class="ad-widget__label">スポンサーリンク</span>
            <div style="background: #e2e8f0; height: 100px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 14px; border-radius: 4px;">
                広告バナー表示エリア（i-mobile）
            </div>
        </div>
    </div>
</body>
</html>
